[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-k8s-audit"
version = "3.0.0"
description = "Kubernetes cluster security auditor — motor YAML extensible CIS K8s Benchmark, kube-bench wrapper, delta scan"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "kubernetes", "k8s", "container", "cloud-native"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6.0"]


[project.scripts]
vamp-k8s-audit = "vamp_k8s_audit:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-k8s-audit"
Repository = "https://github.com/Vampsecure-Labs/vamp-k8s-audit"

[tool.setuptools]
packages = ["vamp_k8s_audit"]
py-modules = ["vampsec_report"]

[tool.setuptools.package-data]
vamp_k8s_audit = ["rules/*.yaml"]
